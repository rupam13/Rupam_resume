<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6d5a"/>
      <stop offset="100%" stop-color="#ea4c38"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#2d2a24" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Base Badge Card -->
  <rect x="15" y="15" width="370" height="370" rx="28" fill="#fcfbf9" stroke="#2d2a24" stroke-width="8" filter="url(#shadow)"/>
  
  <!-- Outer Coral Ring Header -->
  <rect x="35" y="35" width="330" height="110" rx="18" fill="url(#bgGrad)" stroke="#2d2a24" stroke-width="5"/>
  
  <!-- n8n Node Node Workflow Graphic (Icon) -->
  <g transform="translate(60, 60)">
    <!-- Node 1 -->
    <circle cx="20" cy="30" r="14" fill="#ffffff" stroke="#2d2a24" stroke-width="4"/>
    <!-- Connection Line -->
    <line x1="34" y1="30" x2="66" y2="30" stroke="#ffffff" stroke-width="5" stroke-dasharray="3,3"/>
    <!-- Node 2 -->
    <rect x="66" y="16" width="28" height="28" rx="6" fill="#ffffff" stroke="#2d2a24" stroke-width="4"/>
    <!-- Connection Line 2 -->
    <line x1="94" y1="30" x2="126" y2="30" stroke="#ffffff" stroke-width="5"/>
    <!-- Node 3 -->
    <circle cx="140" cy="30" r="14" fill="#ffffff" stroke="#2d2a24" stroke-width="4"/>
  </g>

  <!-- Header Banner Text -->
  <text x="200" y="112" font-family="'Inter', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">n8n CERTIFIED</text>
  <text x="200" y="130" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#fcfbf9" text-anchor="middle" letter-spacing="2" opacity="0.9">N8N101 WORKFLOW SPECIALIST</text>

  <!-- Certificate Body Text -->
  <text x="200" y="185" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#2d2a24" text-anchor="middle">Essentials: Your First Workflows</text>
  
  <!-- Ribbon Badge -->
  <rect x="80" y="205" width="240" height="34" rx="17" fill="#2d2a24"/>
  <text x="200" y="227" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#ff6d5a" text-anchor="middle" letter-spacing="1">OFFICIAL CERTIFICATION</text>

  <!-- Details Box -->
  <rect x="45" y="260" width="310" height="90" rx="14" fill="#f4f0ea" stroke="#2d2a24" stroke-width="3"/>
  
  <!-- Checkmark Seal -->
  <circle cx="85" cy="305" r="22" fill="#2ecc71" stroke="#2d2a24" stroke-width="3"/>
  <path d="M75 305 L82 312 L96 298" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <text x="125" y="295" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#2d2a24">Recipient: Rupam Wadibhasme</text>
  <text x="125" y="315" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#635e53">Issued by: n8n Education Team</text>
  <text x="125" y="333" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#ff6d5a">ID: c838fbfcfd7e483f8ef5b7e50da7c39e</text>
</svg>
