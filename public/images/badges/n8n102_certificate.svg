<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad102" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6d5a"/>
      <stop offset="100%" stop-color="#d9381e"/>
    </linearGradient>
    <filter id="shadow102" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#2d2a24" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Base Badge Card -->
  <rect x="15" y="15" width="370" height="370" rx="28" fill="#fcfbf9" stroke="#2d2a24" stroke-width="8" filter="url(#shadow102)"/>
  
  <!-- Outer Coral Ring Header -->
  <rect x="35" y="35" width="330" height="110" rx="18" fill="url(#bgGrad102)" stroke="#2d2a24" stroke-width="5"/>
  
  <!-- n8n Node Workflow Graphic (Icon) -->
  <g transform="translate(45, 55)">
    <circle cx="20" cy="30" r="13" fill="#ffffff" stroke="#2d2a24" stroke-width="3.5"/>
    <line x1="33" y1="30" x2="60" y2="30" stroke="#ffffff" stroke-width="4.5"/>
    <rect x="60" y="17" width="26" height="26" rx="5" fill="#ffffff" stroke="#2d2a24" stroke-width="3.5"/>
    <line x1="86" y1="30" x2="113" y2="30" stroke="#ffffff" stroke-width="4.5"/>
    <polygon points="113,18 139,30 113,42" fill="#ffffff" stroke="#2d2a24" stroke-width="3.5"/>
  </g>

  <!-- Header Banner Text -->
  <text x="200" y="112" font-family="'Inter', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">n8n CERTIFIED</text>
  <text x="200" y="130" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#fcfbf9" text-anchor="middle" letter-spacing="1.5">N8N102 API INTEGRATION PIPELINE</text>

  <!-- Certificate Body Text -->
  <text x="200" y="178" font-family="'Inter', sans-serif" font-weight="900" font-size="15" fill="#2d2a24" text-anchor="middle">Integrations: APIs &amp; Connected</text>
  <text x="200" y="196" font-family="'Inter', sans-serif" font-weight="900" font-size="15" fill="#2d2a24" text-anchor="middle">Workflows</text>
  
  <!-- Ribbon Badge -->
  <rect x="80" y="212" width="240" height="32" rx="16" fill="#2d2a24"/>
  <text x="200" y="233" font-family="'Inter', sans-serif" font-weight="800" font-size="12" fill="#ff6d5a" text-anchor="middle" letter-spacing="1">ADVANCED CERTIFICATION</text>

  <!-- Details Box -->
  <rect x="45" y="260" width="310" height="90" rx="14" fill="#f4f0ea" stroke="#2d2a24" stroke-width="3"/>
  
  <!-- Checkmark Seal -->
  <circle cx="85" cy="305" r="22" fill="#2ecc71" stroke="#2d2a24" stroke-width="3"/>
  <path d="M75 305 L82 312 L96 298" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <text x="125" y="295" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#2d2a24">Recipient: Rupam Wadibhasme</text>
  <text x="125" y="315" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#635e53">Issued by: n8n Education Team</text>
  <text x="125" y="333" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#d9381e">ID: 385ad207b69444fabfc1079b549f4b03</text>
</svg>
